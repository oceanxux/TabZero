name: Chrome Extension 

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Archive extension distribution zip
        run: zip -r tabzero-${{ github.ref_name || github.sha }}.zip TabZero/

      - name: 4. Create GitHub Release and attach assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: tabzero-${{ github.ref_name }}.zip
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            🎉 **TabZero ${{ github.ref_name }}**

            - **Distribution Package**: `tabzero-${{ github.ref_name }}.zip`
